openapi: 3.0.0
info:
  title: Library Management System API
  description: >-
    A complete RESTful API for a Library Management System built with Node.js,
    Express, JWT authentication, and Google Firebase Firestore. Supports
    role-based access control for Students and Librarians.
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:5000
    description: Local development server

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your JWT token in the format **Bearer <token>**

  schemas:
    ApiResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
          example: Error description message

    User:
      type: object
      properties:
        userId:
          type: string
          example: usr_872364
        name:
          type: string
          example: John Doe
        email:
          type: string
          example: student@example.com
        role:
          type: string
          enum: [student, librarian]
          example: student
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserRegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: student@example.com
        password:
          type: string
          format: password
          minLength: 6
          example: secret123
        role:
          type: string
          enum: [student, librarian]
          default: student
          example: student

    UserLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: student@example.com
        password:
          type: string
          format: password
          example: secret123

    UserProfileUpdateRequest:
      type: object
      properties:
        name:
          type: string
          example: Johnathan Doe

    UserRoleUpdateRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [student, librarian]
          example: librarian

    Book:
      type: object
      properties:
        bookId:
          type: string
          example: bk_982341
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin
        isbn:
          type: string
          example: 978-0132350884
        category:
          type: string
          example: Software Engineering
        status:
          type: string
          enum: [available, borrowed]
          example: available
        quantity:
          type: integer
          example: 5
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    BookCreateRequest:
      type: object
      required:
        - title
        - author
        - isbn
        - category
        - quantity
      properties:
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin
        isbn:
          type: string
          example: 978-0132350884
        category:
          type: string
          example: Software Engineering
        quantity:
          type: integer
          minimum: 1
          example: 5

    BookUpdateRequest:
      type: object
      properties:
        title:
          type: string
          example: "Clean Code: A Handbook of Agile Software Craftsmanship"
        author:
          type: string
          example: Robert C. Martin
        isbn:
          type: string
          example: 978-0132350884
        category:
          type: string
          example: Software Engineering
        quantity:
          type: integer
          minimum: 0
          example: 4
        status:
          type: string
          enum: [available, borrowed]
          example: available

    Transaction:
      type: object
      properties:
        transactionId:
          type: string
          example: tx_102938
        userId:
          type: string
          example: usr_872364
        bookId:
          type: string
          example: bk_982341
        type:
          type: string
          enum: [borrow, return]
          example: borrow
        borrowDate:
          type: string
          format: date-time
        returnDate:
          type: string
          format: date-time
          nullable: true
        dueDate:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, returned, overdue]
          example: active
        createdAt:
          type: string
          format: date-time

paths:
  /api/auth/register:
    post:
      summary: Register a new user
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegisterRequest'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: User registered successfully
                  user:
                    $ref: '#/components/schemas/User'
        400:
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        409:
          description: User already exists

  /api/auth/login:
    post:
      summary: User login & JWT generation
      tags: [Authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6...
                  user:
                    $ref: '#/components/schemas/User'
        401:
          description: Invalid email or password

  /api/auth/profile:
    get:
      summary: Get logged-in user profile
      tags: [Authentication]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Profile retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        401:
          description: Unauthorized
    put:
      summary: Update logged-in user profile
      tags: [Authentication]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserProfileUpdateRequest'
      responses:
        200:
          description: Profile updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  user:
                    $ref: '#/components/schemas/User'
        401:
          description: Unauthorized

  /api/books:
    get:
      summary: Get all books (with optional filters)
      tags: [Books]
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Filter books by category
        - in: query
          name: status
          schema:
            type: string
            enum: [available, borrowed]
          description: Filter books by availability status
        - in: query
          name: author
          schema:
            type: string
          description: Filter books by author name
      responses:
        200:
          description: List of books
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                    example: 10
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'
    post:
      summary: Add new book (Librarian only)
      tags: [Books]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookCreateRequest'
      responses:
        201:
          description: Book added successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Book'
        403:
          description: Forbidden (Librarian only)

  /api/books/search:
    get:
      summary: Search books by title, author, or category
      tags: [Books]
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: General search query matching title or author
      responses:
        200:
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book'

  /api/books/{id}:
    get:
      summary: Get single book details
      tags: [Books]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Book details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Book'
        404:
          description: Book not found
    put:
      summary: Update book (Librarian only)
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdateRequest'
      responses:
        200:
          description: Book updated successfully
        403:
          description: Forbidden (Librarian only)
        404:
          description: Book not found
    delete:
      summary: Delete book (Librarian only)
      tags: [Books]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Book deleted successfully
        403:
          description: Forbidden (Librarian only)
        404:
          description: Book not found

  /api/books/{id}/borrow:
    post:
      summary: Borrow a book (Student only)
      tags: [Borrow / Return]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Book borrowed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      transaction:
                        $ref: '#/components/schemas/Transaction'
                      remainingQuantity:
                        type: integer
        400:
          description: Book out of stock or already borrowed
        403:
          description: Forbidden (Student only)

  /api/books/{id}/return:
    post:
      summary: Return a book (Student only)
      tags: [Borrow / Return]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: Book returned successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      transaction:
                        $ref: '#/components/schemas/Transaction'
                      availableQuantity:
                        type: integer
        400:
          description: No active borrow record found
        403:
          description: Forbidden (Student only)

  /api/transactions:
    get:
      summary: Get all transactions across library (Librarian only)
      tags: [Transactions]
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'
        403:
          description: Forbidden (Librarian only)

  /api/transactions/my:
    get:
      summary: Get user's transaction history
      tags: [Transactions]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Current user's transaction list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Transaction'

  /api/users:
    get:
      summary: Get all users (Librarian only)
      tags: [User Management]
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of all users
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  count:
                    type: integer
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        403:
          description: Forbidden (Librarian only)

  /api/users/{id}:
    get:
      summary: Get user details by ID (Librarian only)
      tags: [User Management]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/User'
        403:
          description: Forbidden (Librarian only)
        404:
          description: User not found
    delete:
      summary: Delete user (Librarian only)
      tags: [User Management]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        200:
          description: User deleted successfully
        400:
          description: Cannot delete own account
        403:
          description: Forbidden (Librarian only)
        404:
          description: User not found

  /api/users/{id}/role:
    put:
      summary: Update user role (Librarian only)
      tags: [User Management]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdateRequest'
      responses:
        200:
          description: User role updated successfully
        403:
          description: Forbidden (Librarian only)
        404:
          description: User not found

  /api/test-firebase:
    get:
      summary: Test Firebase Firestore database connection
      tags: [System]
      responses:
        200:
          description: Firebase connected successfully
        500:
          description: Firebase connection error
